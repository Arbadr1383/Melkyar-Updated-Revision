<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملک‌یار</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">

<body data-developer="Swanco-Alireza-Badr-Melkyar"><!-- Developer Signature: SWANCO | Alireza Badr | Melkyar | شرکت برنامه نویسی قو (سهامی خاص) -->
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__logo-img" src="assets/logo.jpg" alt="لوگوی ملک‌یار">
        <span class="sidebar__tagline">سامانه حرفه‌ای مدیریت املاک</span>
      </div>
      <nav id="sidebar-nav" class="sidebar__nav"></nav>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar__search">
          <span class="topbar__search-icon">⌕</span>
          <input id="global-search" type="search" placeholder="جستجوی فایل، مشتری یا «کد ۱۲۳»…">
        </div>
        <div class="topbar__actions">
          <div class="notif-wrap">
            <button id="notif-bell" class="icon-btn" aria-label="اعلان‌ها">
              🔔<span id="notif-badge" class="notif-badge"></span>
            </button>
            <div id="notif-panel" class="notif-panel">
              <h4>اعلان‌ها</h4>
              <ul id="notif-list"></ul>
            </div>
          </div>
          <button id="current-user-btn" class="user-chip" type="button" title="خروج">
            <span>👤</span><span id="current-user-name">کاربر</span>
          </button>
          <button id="theme-toggle" class="icon-btn" aria-label="تغییر تم">🌙</button>
        </div>
      </header>

      <main id="page-content" class="page-content"></main>
    </div>
  </div>

  <div id="toast-host" class="toast-host"></div>

  <!-- Priority 1: پیاده‌سازی‌شده -->
  <script src="js/database.js"></script>
  <script src="js/jalali.js"></script>

  <script src="js/search.js"></script>
  <script src="js/owners.js"></script>

  <script src="js/followups.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/commissions.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/builders.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/users.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/about.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/sharing.js"></script>
  <script src="js/club.js"></script>
  <script src="js/backup.js"></script>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
